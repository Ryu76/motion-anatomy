[project]
name = "motion-anatomy-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "pydantic>=2.11",
  "uvicorn[standard]>=0.35",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
